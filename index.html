<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Campus Navigator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Campus Navigator</h1>

  <div id="controls">
    From: <input id="fromInput" list="placeList" placeholder="Type a place...">
    To: <input id="toInput" list="placeList" placeholder="Type a place...">
    <button id="findButton">Find Route</button>
    <button id="toggleGraph">Hide nodes</button>
  </div>
  <datalist id="placeList"></datalist>

  <p id="message"></p>
  <div id="result"></div>
  <ol id="directions"></ol>

  <div id="coords">Mouse: move over the map to read coordinates</div>
  <div id="clicked">Click the map to copy lat, lon</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="image.js"></script>
  <script src="data.js"></script>
  <script src="routing.js"></script>
  <script src="app.js"></script>
</body>
</html>
